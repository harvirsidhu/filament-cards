name: code style

on:
  push:
    branches: [main, '*.x']
    paths: ['**.php']
  pull_request:
    branches: [main, '*.x']
    paths: ['**.php']

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Fix PHP code style issues
        uses: aglipanci/laravel-pint-action@2.5

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Fix styling
